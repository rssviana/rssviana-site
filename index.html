<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em breve...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Animação de partículas flutuantes */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .particle:nth-child(1) { width: 8px; height: 8px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 12px; height: 12px; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 6px; height: 6px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 10px; height: 10px; left: 40%; animation-delay: 0.5s; }
        .particle:nth-child(5) { width: 14px; height: 14px; left: 50%; animation-delay: 1.5s; }
        .particle:nth-child(6) { width: 8px; height: 8px; left: 60%; animation-delay: 3s; }
        .particle:nth-child(7) { width: 12px; height: 12px; left: 70%; animation-delay: 2.5s; }
        .particle:nth-child(8) { width: 6px; height: 6px; left: 80%; animation-delay: 4s; }
        .particle:nth-child(9) { width: 10px; height: 10px; left: 90%; animation-delay: 0.8s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .main-text {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 300;
            color: white;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 2s ease-out, glow 3s ease-in-out infinite alternate;
        }
        
        .dots {
            display: inline-block;
            animation: dots 2s linear infinite;
        }
        
        @keyframes dots {
            0%, 20% { color: rgba(255, 255, 255, 0.3); }
            40% { color: rgba(255, 255, 255, 0.6); }
            60% { color: rgba(255, 255, 255, 0.9); }
            80%, 100% { color: rgba(255, 255, 255, 1); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes glow {
            from { text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
            to { text-shadow: 0 10px 50px rgba(255, 255, 255, 0.2), 0 0 20px rgba(255, 255, 255, 0.1); }
        }
        
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.05em;
            animation: fadeInUp 2s ease-out 0.5s both;
        }
        
        /* Efeito glassmorphism sutil */
        .glass-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4rem 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: slideIn 2s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .glass-card {
                padding: 3rem 2rem;
                margin: 0 1rem;
            }
            
            .main-text {
                font-size: clamp(2.5rem, 10vw, 6rem);
            }
        }
        
        @media (max-width: 480px) {
            .glass-card {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="container">
        <div class="glass-card">
            <h1 class="main-text">Em breve<span class="dots">...</span></h1>
            <p class="subtitle">Algo incrível está chegando</p>
        </div>
    </div>
</body>
</html>
